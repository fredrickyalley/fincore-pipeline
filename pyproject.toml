[project]
name = "fincore-pipeline"
version = "1.0.0"
description = "FinCore overnight trading data pipeline: PySpark ETL, Airflow orchestration, dbt marts"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.4",  # matches AWS Glue 5.0
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==2.10.4",
    "apache-airflow-providers-amazon>=9.0",
    "apache-airflow-providers-common-sql>=1.20",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "boto3>=1.34",
    "requests>=2.31",
]

[tool.pytest.ini_options]
pythonpath = ["src", "dags", "jobs", "scripts"]
testpaths = ["tests"]
markers = [
    "spark: needs a local JVM (skipped when java is not on PATH)",
    "airflow: needs apache-airflow installed",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["fincore_etl", "fincore_pipeline", "etl_job", "generate_sample_data", "trigger_run"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
