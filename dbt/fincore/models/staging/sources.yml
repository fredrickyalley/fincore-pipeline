version: 2

sources:
  - name: raw
    description: Tables loaded by the Airflow load TaskGroup (Redshift COPY of the ETL Parquet output).
    schema: raw
    loaded_at_field: etl_loaded_at
    freshness:
      # the ETL stamps etl_loaded_at; anything older than 8h when dbt runs is yesterday's data
      warn_after: {count: 8, period: hour}
    tables:
      - name: fincore_trades
        description: Clean FIX trades, one row per order, with realized P&L in USD.
      - name: fincore_market_data
        description: Validated close prices, one row per symbol per day.
      - name: fincore_portfolio_positions
        description: Positions marked to market in USD with risk limits.
