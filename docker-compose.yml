# Local FinCore stack: the production DAG against S3-compatible storage and a Postgres warehouse.
#   cp .env.example .env && docker compose up -d --build
# Production runs on MWAA + Glue + Redshift instead (FINCORE_ENV=aws), see README.md.
name: fincore

x-airflow-base: &airflow-base
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: fincore-airflow:local
  working_dir: /opt/fincore
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - .:/opt/fincore
    - airflow-logs:/opt/airflow/logs
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fincore}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/fincore/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"  # local DAG has no schedule; runs only when triggered
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is not set - copy .env.example to .env and set it}
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
    AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "login": "${AWS_ACCESS_KEY_ID:-test}", "password": "${AWS_SECRET_ACCESS_KEY:-test}", "extra": {"region_name": "${AWS_DEFAULT_REGION:-us-east-1}", "endpoint_url": "http://localstack:4566"}}'
    AIRFLOW_CONN_FINCORE_WAREHOUSE: postgres://${POSTGRES_USER:-fincore}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}@postgres:5432/fincore
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is not set - copy .env.example to .env and set it}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_ENDPOINT_URL: http://localstack:4566
    FINCORE_ENV: local
    FINCORE_RAW_BUCKET: ${FINCORE_RAW_BUCKET:-fincore-raw}
    FINCORE_PROCESSED_BUCKET: ${FINCORE_PROCESSED_BUCKET:-fincore-processed}
    FINCORE_DEMO_TRADE_DATE: ${FINCORE_DEMO_TRADE_DATE:-2026-10-26}
    FINCORE_DEMO_TRADE_COUNT: ${FINCORE_DEMO_TRADE_COUNT:-5000}
    FINCORE_SENSOR_TIMEOUT_MINUTES: ${FINCORE_SENSOR_TIMEOUT_MINUTES:-240}
    FINCORE_S3_ENDPOINT: http://localstack:4566
    FINCORE_SPARK_JARS: /opt/spark-jars/hadoop-aws.jar,/opt/spark-jars/aws-java-sdk-bundle.jar
    FINCORE_ETL_JOB_PATH: /opt/fincore/jobs/etl_job.py
    FINCORE_DBT_PROJECT_DIR: /opt/fincore/dbt/fincore
    FINCORE_DBT_BIN: /opt/dbt-venv/bin/dbt
    FINCORE_DBT_TARGET: local
    FINCORE_WAREHOUSE_HOST: postgres
    FINCORE_WAREHOUSE_PORT: "5432"
    FINCORE_WAREHOUSE_USER: ${POSTGRES_USER:-fincore}
    FINCORE_WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
    FINCORE_WAREHOUSE_DB: fincore
    PYTHONPATH: /opt/fincore/src:/opt/fincore/dags:/opt/fincore/jobs

x-airflow-common: &airflow-common
  <<: *airflow-base
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fincore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
      POSTGRES_DB: fincore
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincore} -d fincore"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3,cloudwatch
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      retries: 30

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: /opt/fincore/docker/airflow/init.sh

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8090}:8080"  # host:container; 8080 on the host is often taken
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- one-off tools: docker compose --profile tools run --rm <name> ---
  etl-local:
    <<: *airflow-base
    profiles: ["tools"]
    entrypoint: /bin/bash
    command: /opt/fincore/docker/airflow/run_etl_local.sh

  tests:
    <<: *airflow-base
    profiles: ["tools"]
    entrypoint: /bin/bash
    command: -c "airflow db migrate > /dev/null && python -m pytest -q -p no:cacheprovider"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-tests.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      FINCORE_ENV: local
      PYTHONPATH: /opt/fincore/src:/opt/fincore/dags:/opt/fincore/jobs

volumes:
  postgres-data:
  airflow-logs:
